# Deploy do servidor do Discórdia no Render (plano grátis).
# Os valores marcados com "sync: false" são pedidos na hora de criar o serviço.
services:
  - type: web
    name: discordia-server
    runtime: node
    plan: free
    # Sem rootDir: o servidor também entrega a versão web do app (app/renderer).
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: PASSWORD
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_PASSWORD
        sync: false
